[build-system]
requires = ["setuptools>=69.0.2"]
build-backend = "setuptools.build_meta"

[project]
name = "lbrxchat"
version = "0.1.0"
description = "LIBRAXIS Chat - advanced TUI-based RAG system powered by MLX and LM Studio"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "LIBRAXIS Team", email = "contact@libraxis.io"}
]
maintainers = [
    {name = "LIBRAXIS Team", email = "contact@libraxis.io"}
]
keywords = ["ai", "chatbot", "rag", "mlx", "lm-studio", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "textual>=3.2.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.0.0",
    "rich>=14.0.0",
    "lmstudio>=0.0.1",
    "requests>=2.28.0",
    "mlx>=0.25.2",
    "tqdm>=4.64.0",
    "pandas>=2.2.3",
    "beautifulsoup4>=4.11.0",
    "lxml>=4.9.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "sentence-transformers>=4.0.0",
    "huggingface-hub>=0.23.1",
    "openai>=1.78.1",
    "llama-index>=0.10.59",
    "llama-index-core>=0.10.0",
    "llama-index-llms-huggingface>=0.1.0",
    "llama-index-embeddings-huggingface>=0.1.0",
    "faiss-cpu>=1.7.4",
    "httpx>=0.28.1",
    "pypdf>=4.3.1",
    "accelerate>=0.20.0",
    "gzip-reader>=0.1.0",
    "python-dateutil>=2.8.0",
    "uuid>=1.30",
    "pathlib>=1.0.0",
    "mlx-lm>=0.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "mypy>=1.7.0",
    "ruff>=0.1.11",
]

[project.urls]
"Homepage" = "https://github.com/libraxis/lbrxchat"
"Bug Tracker" = "https://github.com/libraxis/lbrxchat/issues"
"Documentation" = "https://github.com/libraxis/lbrxchat/wiki"
"Source Code" = "https://github.com/libraxis/lbrxchat"

[tool.setuptools]
packages = ["lbrxchat"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "B", "I"]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true 
